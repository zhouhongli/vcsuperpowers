<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 智能日志分析与诊断平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🔍 日志诊断平台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">日志列表</a></li>
                    <li class="nav-item"><a class="nav-link" href="submit.html">提交日志</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>仪表盘</h2>
            <div>
                <button class="btn btn-outline-primary btn-sm active" onclick="setTrendRange(7)" id="btn7d">近 7 天</button>
                <button class="btn btn-outline-primary btn-sm" onclick="setTrendRange(30)" id="btn30d">近 30 天</button>
            </div>
        </div>

        <!-- 统计概览卡片 -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body text-center">
                        <h5 class="card-title">总日志数</h5>
                        <p class="display-4" id="totalLogs">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger">
                    <div class="card-body text-center">
                        <h5 class="card-title">Critical</h5>
                        <p class="display-4" id="criticalCount">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body text-center">
                        <h5 class="card-title">High</h5>
                        <p class="display-4" id="highCount">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body text-center">
                        <h5 class="card-title">Low / Medium</h5>
                        <p class="display-4" id="lowMediumCount">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区 -->
        <div class="row g-4">
            <!-- 异常类型分布 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">异常类型分布</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="exceptionTypeChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 严重程度分布 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">严重程度分布</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="severityChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 异常趋势 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">异常趋势</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top 服务 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Top 5 服务异常排名</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="topServicesChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
